- name: Configure Proxmox host
  hosts: proxmox
  tasks:
    - name: Install subscription popup patch script
      ansible.builtin.copy:
        src: files/pve-no-nag.sh
        dest: /usr/local/sbin/pve-no-nag.sh
        mode: "0755"

    - name: Run the patch after every dpkg run
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/99-pve-no-nag
        content: |
          DPkg::Post-Invoke { "/usr/local/sbin/pve-no-nag.sh"; };
        mode: "0644"

    - name: Apply the patch now
      ansible.builtin.command: /usr/local/sbin/pve-no-nag.sh
      register: nag
      changed_when: "'patched' in nag.stdout"
