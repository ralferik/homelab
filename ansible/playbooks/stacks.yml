- name: Deploy Docker Compose stacks
  hosts: docker
  become: true
  vars:
    stacks_dir: /opt/stacks
    tls_src: "{{ lookup('env', 'HOME') }}/homelab-secrets/tls"
    stacks:
      - traefik
      - adguard
      - monitoring
  tasks:
    - name: Create stacks directory
      ansible.builtin.file:
        path: "{{ stacks_dir }}"
        state: directory
        mode: "0755"

    - name: Copy stack files
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../compose/{{ item }}/"
        dest: "{{ stacks_dir }}/{{ item }}/"
        mode: "0644"
        directory_mode: "0755"
      loop: "{{ stacks }}"

    - name: Create certificate directory for Traefik
      ansible.builtin.file:
        path: "{{ stacks_dir }}/traefik/certs"
        state: directory
        mode: "0700"

    - name: Copy TLS certificate and key
      ansible.builtin.copy:
        src: "{{ tls_src }}/{{ item.name }}"
        dest: "{{ stacks_dir }}/traefik/certs/{{ item.name }}"
        mode: "{{ item.mode }}"
      loop:
        - { name: home.arpa.crt, mode: "0644" }
        - { name: home.arpa.key, mode: "0600" }
      diff: false

    - name: Start stacks
      community.docker.docker_compose_v2:
        project_src: "{{ stacks_dir }}/{{ item }}"
        state: present
      loop: "{{ stacks }}"

