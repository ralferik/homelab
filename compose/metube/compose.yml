services:
  metube:
    image: ghcr.io/alexta69/metube:2026.11.01
    container_name: metube
    restart: unless-stopped
    mem_limit: 1g
    environment:
      - DELETE_FILE_ON_TRASHCAN=true
      - TZ=Europe/Tallinn
    volumes:
      - metube-downloads:/downloads
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.metube.rule=Host(`metube.home.arpa`)
      - traefik.http.routers.metube.entrypoints=websecure
      - traefik.http.services.metube.loadbalancer.server.port=8081

volumes:
  metube-downloads:

networks:
  proxy:
    external: true
