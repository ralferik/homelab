global:
  scrape_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["192.168.1.10:9100"]
        labels:
          instance: pve
      - targets: ["192.168.1.20:9100"]
        labels:
          instance: docker01
