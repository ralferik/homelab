# Based on the upstream docker/docker-compose.prod.yml, trimmed to the
# variables this deployment sets. Secrets come from .env (not in Git).
services:
  db:
    image: postgres:18.3-alpine
    container_name: sparkyfitness-db
    restart: unless-stopped
    mem_limit: 512m
    environment:
      - POSTGRES_DB=sparkyfitness_db
      - POSTGRES_USER=sparky
      - POSTGRES_PASSWORD=${SPARKY_FITNESS_DB_PASSWORD:?set in .env}
    volumes:
      - sparkyfitness-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparky -d sparkyfitness_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - sparkyfitness

  server:
    image: codewithcj/sparkyfitness_server:v1.12.1
    container_name: sparkyfitness-server
    restart: unless-stopped
    mem_limit: 768m
    stop_grace_period: 20s
    environment:
      - SPARKY_FITNESS_DB_HOST=db
      - SPARKY_FITNESS_DB_PORT=5432
      - SPARKY_FITNESS_DB_NAME=sparkyfitness_db
      - SPARKY_FITNESS_DB_USER=sparky
      - SPARKY_FITNESS_DB_PASSWORD=${SPARKY_FITNESS_DB_PASSWORD}
      - SPARKY_FITNESS_APP_DB_USER=sparky_app
      - SPARKY_FITNESS_APP_DB_PASSWORD=${SPARKY_FITNESS_APP_DB_PASSWORD:?set in .env}
      - SPARKY_FITNESS_API_ENCRYPTION_KEY=${SPARKY_FITNESS_API_ENCRYPTION_KEY:?set in .env}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?set in .env}
      - SPARKY_FITNESS_ADMIN_EMAIL=${SPARKY_FITNESS_ADMIN_EMAIL:-}
      - SPARKY_FITNESS_DISABLE_SIGNUP=${SPARKY_FITNESS_DISABLE_SIGNUP:-false}
      - SPARKY_FITNESS_FRONTEND_URL=https://fitness.home.arpa
      - SPARKY_FITNESS_SERVER_PORT=3010
      # Traefik plus the bundled nginx in the frontend container.
      - SPARKY_FITNESS_TRUSTED_PROXY_HOPS=2
      - NODE_ENV=production
      - TZ=Europe/Tallinn
      - SPARKY_FITNESS_LOG_LEVEL=ERROR
      - PUID=1000
      - GUID=1000
    volumes:
      - sparkyfitness-backup:/app/SparkyFitnessServer/backup
      - sparkyfitness-uploads:/app/SparkyFitnessServer/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sparkyfitness

  frontend:
    image: codewithcj/sparkyfitness:v1.12.1
    container_name: sparkyfitness-frontend
    restart: unless-stopped
    mem_limit: 128m
    environment:
      - SPARKY_FITNESS_FRONTEND_URL=https://fitness.home.arpa
      - SPARKY_FITNESS_SERVER_HOST=server
      - SPARKY_FITNESS_SERVER_PORT=3010
      - PUID=1000
      - GUID=1000
    depends_on:
      - server
    networks:
      - sparkyfitness
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.sparkyfitness.rule=Host(`fitness.home.arpa`)
      - traefik.http.routers.sparkyfitness.entrypoints=websecure
      - traefik.http.services.sparkyfitness.loadbalancer.server.port=80

volumes:
  sparkyfitness-db:
  sparkyfitness-backup:
  sparkyfitness-uploads:

networks:
  sparkyfitness:
  proxy:
    external: true
